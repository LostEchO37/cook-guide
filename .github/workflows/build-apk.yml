name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Copy APK for GitHub Pages download
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/ember.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ember-apk
          path: downloads/ember.apk

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ember.apk
          git diff --staged --quiet || git commit -m "Update Android APK build."
          git push
