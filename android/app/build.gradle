plugins {
  id 'com.android.application'
}

android {
  namespace 'com.lostecho37.cookguide'
  compileSdk 34

  defaultConfig {
    applicationId 'com.lostecho37.cookguide'
    minSdk 24
    targetSdk 34
    versionCode 3
    versionName '1.0.2'
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
    debug {
      debuggable true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  packaging {
    resources {
      excludes += ['META-INF/DEPENDENCIES']
    }
  }
}

dependencies {
  // No AndroidX / Kotlin deps — keeps the WebView shell APK lean and avoids
  // kotlin-stdlib duplicate-class conflicts on CI.
}
