# Optional: deploy Ember analytics to Render (HTTPS) so GitHub Pages can send events.
# After deploy, set index.html meta analytics-endpoint to your Render URL and push.
services:
  - type: web
    name: ember-analytics
    runtime: python
    plan: free
    rootDir: server
    buildCommand: echo "Python stdlib only — no install"
    startCommand: python3 app.py
    envVars:
      - key: PORT
        value: "8787"
      - key: SITE_ID
        value: ember
      - key: PUBLIC_SITE_URL
        value: https://lostecho37.github.io/ember-yuwen/
      - key: CORS_ORIGIN
        value: https://lostecho37.github.io,http://127.0.0.1:8787,http://localhost:8787
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
