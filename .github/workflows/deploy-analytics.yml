name: Deploy analytics (Render)

# Add repo secrets RENDER_API_KEY + RENDER_SERVICE_ID after first Render deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Set RENDER_API_KEY secret first"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Set RENDER_SERVICE_ID secret first"; exit 1; }
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
