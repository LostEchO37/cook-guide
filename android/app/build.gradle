plugins {
  id 'com.android.application'
}

android {
  namespace 'com.lostecho37.cookguide'
  compileSdk 34

  defaultConfig {
    applicationId 'com.lostecho37.cookguide'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
    debug {
      debuggable true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
}
